<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Bun playground</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <strong class="title"><img src="/src/bun-logo.svg" alt="" width="23" height="20" /><span id="title">Bun playground</span></strong>
      <button id="run"><i class="i-lucide-play" aria-hidden="true"></i> Run</button>
      <button id="install"><i class="i-lucide-download" aria-hidden="true"></i> bun install</button>
      <button id="newfile"><i class="i-lucide-file-plus" aria-hidden="true"></i> New file</button>
      <button id="openfolder"><i class="i-lucide-folder-open" aria-hidden="true"></i> Open folder</button>
      <button id="openrepo"><i class="i-lucide-github" aria-hidden="true"></i> Open GitHub repo</button>
      <select id="example" title="Example project">
        <option value="">Confetti demo</option>
      </select>
      <input id="folderinput" type="file" webkitdirectory multiple hidden />
      <span id="status" role="status" data-state="idle">Stopped</span>
      <span id="modes" role="group" aria-label="Color scheme"></span>
      <select id="theme" title="Theme"></select>
    </header>
    <main>
      <nav id="tree"></nav>
      <section id="editor"></section>
      <div id="right">
        <div id="preview-backdrop" hidden></div>
        <div id="preview-wrap">
          <form id="request">
            <select id="req-method" title="Method">
              <option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option>
            </select>
            <input id="req-path" value="/" spellcheck="false" title="Path on the running server" />
            <button><i class="i-lucide-send" aria-hidden="true"></i> Send</button>
            <button type="button" id="expand" title="Expand preview (Esc)" aria-pressed="false"></button>
          </form>
          <textarea id="req-body" spellcheck="false" placeholder="Request body (JSON is sent as application/json)"></textarea>
          <iframe id="preview" title="preview"></iframe>
          <pre id="response" hidden></pre>
        </div>
        <div id="console-wrap">
          <div id="console-head">
            <i class="i-lucide-square-terminal" aria-hidden="true"></i>
            <span class="label">Console</span>
            <span id="console-count" class="chip" title="Lines">0</span>
            <span id="console-errors" class="chip error" title="Errors" hidden><i class="i-lucide-circle-x" aria-hidden="true"></i><span></span></span>
            <span id="console-warns" class="chip warn" title="Warnings" hidden><i class="i-lucide-triangle-alert" aria-hidden="true"></i><span></span></span>
            <button id="clear" title="Clear console" aria-label="Clear console" disabled><i class="i-lucide-trash-2" aria-hidden="true"></i></button>
          </div>
          <div id="console"></div>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
