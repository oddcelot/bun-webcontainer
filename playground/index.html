<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Bun playground</title>
    <meta name="description" content="Run Bun.serve apps, install packages and edit TypeScript in a tab, built from Bun's own Rust crates compiled to wasm64." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Social cards need absolute URLs: these point at the runbun.dev deploy. public/og.png comes from `bun run og`. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://runbun.dev/" />
    <meta property="og:title" content="Bun in your browser · runbun.dev" />
    <meta property="og:description" content="Run Bun.serve apps, install packages and edit TypeScript in a tab, built from Bun's own Rust crates compiled to wasm64." />
    <meta property="og:image" content="https://runbun.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bun's logo next to the words: Bun in your browser" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <strong class="title"><img src="/src/bun-logo.svg" alt="" width="23" height="20" /><span id="title">Bun playground</span></strong>
      <button id="run"><i class="i-lucide-play" aria-hidden="true"></i> Run</button>
      <button id="install" title="bun install"><i class="i-lucide-download" aria-hidden="true"></i><span class="label">bun install</span></button>
      <button id="newfile" title="New file"><i class="i-lucide-file-plus" aria-hidden="true"></i><span class="label">New file</span></button>
      <button id="openfolder" title="Open folder"><i class="i-lucide-folder-open" aria-hidden="true"></i><span class="label">Open folder</span></button>
      <button id="openrepo" title="Open GitHub repo"><i class="i-lucide-github" aria-hidden="true"></i><span class="label">Open GitHub repo</span></button>
      <select id="example" title="Example project">
        <option value="">Confetti demo</option>
      </select>
      <input id="folderinput" type="file" webkitdirectory multiple hidden />
      <span id="status" role="status" data-state="idle">Stopped</span>
      <span id="modes" role="group" aria-label="Color scheme"></span>
      <select id="theme" title="Theme"></select>
    </header>
    <main>
      <nav id="tree"></nav>
      <section id="editor-pane">
        <div id="tabs" class="tabs" role="tablist" aria-label="Open files"></div>
        <div id="editor"></div>
      </section>
      <div id="right">
        <div id="preview-backdrop" hidden></div>
        <div id="preview-wrap">
          <div id="preview-tabs" class="tabs" role="tablist" aria-label="Previews"></div>
          <form id="request">
            <select id="req-method" title="Method">
              <option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option>
            </select>
            <input id="req-path" value="/" spellcheck="false" title="Path on the running server" />
            <button><i class="i-lucide-send" aria-hidden="true"></i> Send</button>
            <button type="button" id="expand" title="Expand preview (Esc)" aria-pressed="false"></button>
          </form>
          <textarea id="req-body" spellcheck="false" placeholder="Request body (JSON is sent as application/json)"></textarea>
          <div id="preview-views"></div>
        </div>
        <div id="console-wrap">
          <div id="console-head">
            <i class="i-lucide-square-terminal" aria-hidden="true"></i>
            <span class="label">Console</span>
            <span id="console-count" class="chip" title="Lines">0</span>
            <span id="console-errors" class="chip error" title="Errors" hidden><i class="i-lucide-circle-x" aria-hidden="true"></i><span></span></span>
            <span id="console-warns" class="chip warn" title="Warnings" hidden><i class="i-lucide-triangle-alert" aria-hidden="true"></i><span></span></span>
            <button id="clear" title="Clear console" aria-label="Clear console" disabled><i class="i-lucide-trash-2" aria-hidden="true"></i></button>
          </div>
          <div id="console"></div>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
