[package]
name = "bun_sys_wasm"
version = "0.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
bun_sys = { path = "../bun/src/sys" }
bun_core = { path = "../bun/src/bun_core" }
bun_sys_host = { path = "../sys-host", features = ["imports"] }

[profile.release]
panic = "abort"
opt-level = "s"
lto = true

[profile.dev]
panic = "abort"
