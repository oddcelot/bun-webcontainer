$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'rust'
tags: ['wasm64']

tasks:
  build:
    outputs:
      - '/target/wasm64-unknown-unknown/release/bun_semver_wasm.wasm'
  test:
    # diff.mjs compares against expected.json, generated by gen-expected.ts with a native Bun.
    script: 'node test.mjs && node diff.mjs'
    inputs:
      - 'expected.json'
