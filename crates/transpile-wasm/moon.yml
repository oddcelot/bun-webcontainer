$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'rust'
tags: ['wasm64']

tasks:
  build:
    outputs:
      - '/target/wasm64-unknown-unknown/release/bun_transpile_wasm.wasm'
  test:
    # Diffs against `bun build --no-bundle` (native Bun, pinned in /.prototools) on corpus/.
    inputs:
      - 'corpus/**/*'
      # apis-test.ts runs Bun.markdown and Bun.XML.parse as the playground's worker does.
      - '/apps/playground/src/worker/markdown.ts'
      - '/apps/playground/src/worker/xml.ts'
