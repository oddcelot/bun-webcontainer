$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'rust'
tags: ['wasm64']

tasks:
  build:
    outputs:
      - '/target/wasm64-unknown-unknown/release/bun_transpile_wasm.wasm'
  test:
    # Diffs against `bun build --no-bundle` (native Bun, pinned in /.prototools) on corpus/.
    inputs:
      - 'corpus/**/*'
