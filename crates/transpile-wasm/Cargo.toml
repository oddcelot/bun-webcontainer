[package]
name = "bun_transpile_wasm"
version = "0.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# the C/C++ stand-ins the parser and printer link against
bun_wasm_stubs = { path = "../wasm-stubs" }
bun_alloc = { path = "../../bun/src/bun_alloc" }
bun_ast = { path = "../../bun/src/ast" }
bun_js_parser = { path = "../../bun/src/js_parser" }
bun_js_printer = { path = "../../bun/src/js_printer" }
bun_sourcemap = { path = "../../bun/src/sourcemap" }
# Bun.Transpiler: define values (parse_env_json) and the data loaders
bun_parsers = { path = "../../bun/src/parsers" }
bun_core = { path = "../../bun/src/bun_core" }
bun_paths = { path = "../../bun/src/paths" }
bun_collections = { path = "../../bun/src/collections" }
# Bun.Transpiler's md loader and .md imports (render_to_html)
bun_md = { path = "../../bun/src/md" }
# defines the bun_sys_host_* symbols bun_sys declares, as -ENOSYS stubs (keeps the wasm import-free)
bun_sys_host = { path = "../sys-host" }
