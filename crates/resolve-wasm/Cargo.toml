[package]
name = "bun_resolve_wasm"
version = "0.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# the C/C++ stand-ins the parser and printer link against
bun_wasm_stubs = { path = "../wasm-stubs" }
bun_resolver = { path = "../../bun/src/resolver" }
bun_ast = { path = "../../bun/src/ast" }
bun_install_types = { path = "../../bun/src/install_types" }
bun_semver = { path = "../../bun/src/semver" }
bun_dotenv = { path = "../../bun/src/dotenv" }
# `Bun.Glob`: the matcher and the directory walker (over bun_sys, so the VFS)
bun_glob = { path = "../../bun/src/glob" }
bun_sys = { path = "../../bun/src/sys" }
bun_options_types = { path = "../../bun/src/options_types" }
# defines the bun_sys_host_* symbols bun_sys declares, as `bun_sys.*` wasm imports served by the VFS
bun_sys_host = { path = "../sys-host", features = ["imports"] }
bun_parsers = { path = "../../bun/src/parsers" }
bun_alloc = { path = "../../bun/src/bun_alloc" }
# `Bun.password`: the argon2 (vendored by scripts/bun-prepare.ts) and bcrypt crates Bun uses
rust-argon2 = { path = "../../bun/vendor/rust-argon2", default-features = false }
# Without features: its `alloc` API needs getrandom, which has no wasm64 backend; password.rs does that part.
bcrypt = { version = "0.19", default-features = false }
base64 = { version = "0.23", default-features = false }
