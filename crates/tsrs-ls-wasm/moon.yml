$schema: 'https://moonrepo.dev/schemas/project.json'

# TS7 language service (tsrs). Own Rust pin and target (wasm32-wasip1), no Bun crates.
language: 'rust'

fileGroups:
  sources:
    - 'src/**/*'
    - 'build.rs'
    - 'Cargo.toml'
    - 'Cargo.lock'
    - 'rust-toolchain.toml'

tasks:
  build:
    command: 'cargo build --release --target wasm32-wasip1'
    inputs:
      - '@group(sources)'
    outputs:
      - 'target/wasm32-wasip1/release/*.wasm'
  test:
    command: 'node test.ts'
    # Through moon's toolchains, child processes get PROTO_*_VERSION, so the `bun` the tests spawn in temp dirs
    # (outside this repo's .prototools) is still the pinned one, not proto's global default.
    toolchains: ['node', 'bun']
    deps: ['~:build']
    inputs:
      - '*.ts'
      # Type-checks the .d.ts files in apps/playground/node_modules.
      - '/bun.lock'
