$schema: 'https://moonrepo.dev/schemas/project.json'

# node:crypto's ciphers, signatures and key objects on RustCrypto (no Bun crates, so not tagged wasm64: it takes no
# part in the bun/ inputs). Still wasm64 and still in the root workspace, so one -Zbuild-std toolchain builds it.
language: 'rust'

fileGroups:
  sources:
    - 'src/**/*'
    - 'Cargo.toml'
    - '/Cargo.toml'
    - '/Cargo.lock'
    - '/rust-toolchain.toml'

tasks:
  build:
    command: 'cargo'
    args: ['build', '-Zbuild-std=std,panic_abort', '--target', 'wasm64-unknown-unknown', '--release']
    inputs:
      - '@group(sources)'
    outputs:
      - '/target/wasm64-unknown-unknown/release/bun_crypto_wasm.wasm'
