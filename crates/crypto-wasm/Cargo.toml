[package]
name = "bun_crypto_wasm"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

# RustCrypto, for node:crypto's ciphers, signatures and key objects (the sync APIs WebCrypto can't serve).
# Features are the least that does the job; no password-based PKCS#8 encryption.
[dependencies]
aes = "0.8"
ghash = "0.5"
chacha20 = "0.9"
poly1305 = "0.8"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
digest = "0.10"
rand_core = "0.6"
rsa = { version = "0.9", default-features = false, features = ["std", "sha2"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "arithmetic", "std"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "arithmetic", "std"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "pkcs8", "rand_core"] }
getrandom = { version = "0.2", features = ["custom"] }
