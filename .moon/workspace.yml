# https://moonrepo.dev/docs/config/workspace
$schema: 'https://moonrepo.dev/schemas/workspace.json'

versionConstraint: '>=2.6.0'

projects:
  root: '.'
  semver-wasm: 'crates/semver-wasm'
  transpile-wasm: 'crates/transpile-wasm'
  bundle-wasm: 'crates/bundle-wasm'
  sys-wasm: 'crates/sys-wasm'
  resolve-wasm: 'crates/resolve-wasm'
  fmt-wasm: 'crates/fmt-wasm'
  tsrs-ls-wasm: 'crates/tsrs-ls-wasm'
  sys-host: 'crates/sys-host'
  wasm-stubs: 'crates/wasm-stubs'
  shim-test: 'crates/shim-test'
  playground: 'apps/playground'
  docs: 'apps/docs'
  astro: 'packages/astro'

vcs:
  client: 'git'
  defaultBranch: 'main'

hasher:
  # bun/ is gitignored (recreated by scripts/setup-bun.sh), but the wasm builds compile it. The default
  # `vcs` walk only sees tracked files, so edits in bun/src would hit a stale cache.
  walkStrategy: 'glob'
  # The wasm64 task group lists build.rs; not every crate has one.
  ignoreMissingPatterns: ['**/build.rs']
