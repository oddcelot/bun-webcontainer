# https://moonrepo.dev/docs/config/workspace
$schema: 'https://moonrepo.dev/schemas/workspace.json'

versionConstraint: '>=2.6.0'

projects:
  # Every apps/, crates/, examples/ and packages/ directory with a moon.yml; the id is the directory name.
  globs:
    - 'apps/*/moon.yml'
    - 'examples/*/moon.yml'
    - 'crates/*/moon.yml'
    - 'packages/*/moon.yml'
  sources:
    root: '.'

vcs:
  client: 'git'
  defaultBranch: 'main'

hasher:
  # bun/ is gitignored (recreated by scripts/setup-bun.sh), but the wasm builds compile it. The default
  # `vcs` walk only sees tracked files, so edits in bun/src would hit a stale cache.
  walkStrategy: 'glob'
  # The wasm64 task group lists build.rs; not every crate has one.
  ignoreMissingPatterns: ['**/build.rs']
