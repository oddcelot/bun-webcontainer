# typos (Brewfile: typos-cli); `moon run root:typos`.
[files]
# Upstream Bun's code and git hashes, applied as-is.
extend-exclude = ["patches/bun/", "apps/playground/scripts/data-apis/"]

[default.extend-words]
WRONLY = "WRONLY"  # O_WRONLY
Flate = "Flate"    # fflate's FlateStreamHandler
lits = "lits"      # literals
styl = "styl"      # Stylus, a language in Expressive Code's groups (packages/astro/src/remark.ts)
