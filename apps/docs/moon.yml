$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'

fileGroups:
  sources:
    - 'src/**/*'
    - 'public/**/*'
    - '*.ts'
    - 'tsconfig.json'
    - 'package.json'
    - 'wrangler.jsonc'
    - '/packages/ui/**/*'
    - '/bun.lock'
    # @runbun/astro (workspace:*), not built: the docs load its sources.
    - '/packages/astro/*.{js,ts}'
    - '/packages/astro/components/**/*'
    - '/packages/astro/package.json'

tasks:
  check:
    command: 'bun run check'
    inputs:
      - '@group(sources)'
  build:
    command: 'bun run build'
    inputs:
      - '@group(sources)'
    outputs:
      - 'dist/**/*'
  links:
    # Internal links of the built site (offline: external URLs are skipped). Needs lychee (Brewfile).
    script: 'lychee --offline --no-progress --root-dir "$PWD/dist" dist'
    deps: ['~:build']
    inputs:
      - 'dist/**/*'
  dev:
    # The embeds frame the playground dev server, so it runs alongside (scripts/dev.sh does the same by hand).
    # When an AI agent runs it, `astro dev` backgrounds itself (stop: `cd docs && bunx astro dev stop`) and the task
    # ends at once; from a terminal it stays in the foreground.
    command: 'bun run dev'
    preset: 'server'
    deps:
      - 'playground:dev'
  deploy-canary:
    # docs-canary.runbun.dev (wrangler.jsonc env.canary), linking canary.runbun.dev; built into dist-canary/.
    script: >-
      bunx astro build --outDir dist-canary &&
      ../../scripts/canary-dist.sh dist-canary && bunx wrangler deploy --env canary
    env:
      DOCS_URL: 'https://docs-canary.runbun.dev/'
      PLAYGROUND_URL: 'https://canary.runbun.dev/'
      # Shows the canary badge/banner (apps/playground/src/canary.ts, apps/docs/src/components/Banner.astro).
      CANARY: '1'
    options:
      cache: false
      runInCI: false
