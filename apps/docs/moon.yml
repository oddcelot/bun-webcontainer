$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'

fileGroups:
  sources:
    - 'src/**/*'
    - 'public/**/*'
    - '*.ts'
    - 'tsconfig.json'
    - 'package.json'
    - 'wrangler.jsonc'
    - '/packages/ui/**/*'
    - '/bun.lock'
    # @runbun/astro (workspace:*): the docs load its dist/, built by astro:build (a dep of the tasks below).
    - '/packages/astro/src/**/*'
    - '/packages/astro/components/**/*'
    - '/packages/astro/package.json'
    # @astrojs/solid-js (workspace:*, vendored v8) and its renderer: their dist/, built by astro-solid:build.
    - '/packages/astro-solid/src/**/*'
    - '/packages/astro-solid/package.json'
    - '/packages/astro-solid-renderer/src/**/*'
    - '/packages/astro-solid-renderer/package.json'

tasks:
  check:
    command: 'bun run check'
    deps: ['astro:build', 'astro-solid:build']
    inputs:
      - '@group(sources)'
  build:
    command: 'bun run build'
    deps: ['astro:build', 'astro-solid:build']
    inputs:
      - '@group(sources)'
    outputs:
      - 'dist/**/*'
  links:
    # Internal links of the built site's pages (offline: external URLs are skipped). Needs lychee (Brewfile). Only the
    # HTML: the llms*.txt files are the same pages as plain text, where prose like `file:///…` reads as a link.
    script: 'lychee --offline --no-progress --extensions html --root-dir "$PWD/dist" dist'
    deps: ['~:build']
    inputs:
      - 'dist/**/*'
  dev:
    # The embeds frame the playground dev server, so it runs alongside (scripts/dev.ts does the same by hand).
    # When an AI agent runs it, `astro dev` backgrounds itself (stop: `cd docs && bunx astro dev stop`) and the task
    # ends at once; from a terminal it stays in the foreground.
    command: 'bun run dev'
    preset: 'server'
    deps:
      - 'astro:build'
      - 'astro-solid:build'
      - 'playground:dev'
  deploy-canary:
    # docs-canary.runbun.dev (wrangler.jsonc env.canary), linking canary.runbun.dev; built into dist-canary/.
    deps: ['astro:build', 'astro-solid:build']
    script: >-
      bunx astro build --outDir dist-canary &&
      ../../scripts/canary-dist.ts dist-canary && bunx wrangler deploy --env canary
    env:
      DOCS_URL: 'https://docs-canary.runbun.dev/'
      PLAYGROUND_URL: 'https://canary.runbun.dev/'
      # Shows the canary badge/banner (apps/playground/src/canary.ts, apps/docs/src/components/Banner.astro).
      CANARY: '1'
    options:
      cache: false
      runInCI: false
