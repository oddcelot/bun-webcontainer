$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'

fileGroups:
  sources:
    - 'src/**/*'
    - 'worker/**/*'
    - 'embed-element/**/*'
    # The gallery's projects, the examples submodule (src/examples.ts globs them into the build).
    - 'examples/**/*'
    - '!examples/**/node_modules/**/*'
    - 'public/**/*'
    # Copied in from the wasm crates by scripts/copy-wasm.ts; their builds are deps instead.
    - '!public/*.wasm'
    - 'scripts/**/*'
    - '/patches/npm/**/*'
    - '*.html'
    - '*.ts'
    - 'tsconfig*.json'
    - 'package.json'
    - '/packages/ui/**/*'
    - '/packages/vfs/**/*'
    - '/packages/embed/src/**/*'
    - '/bun.lock'

tasks:
  typecheck:
    command: 'bun run typecheck'
    inputs:
      - '@group(sources)'
  test:
    # Console/inspect formatting against native bun on a corpus of values (scripts/inspect-corpus/diff.ts), and the
    # data APIs that need no wasm (scripts/data-apis: Bun.JSONL, Bun.XML.stringify; Bun.markdown and Bun.XML.parse are
    # in transpile-wasm:test), the embed's `requests` parser (scripts/requests.ts) and the request panel's helpers
    # (scripts/request-fields.ts), the worker's VFS mirror (scripts/vfs-mirror.ts), `bun test`'s per-file counts
    # (scripts/test-results.ts), what `persist` leaves unsaved (scripts/persist-skip.ts), how a test run that doesn't
    # report ends: Stop, the watchdog, process.exit (scripts/runner-stop.ts), who the embed's `change` event says
    # changed a file (scripts/change-origin.ts), the worker's Requests keeping forbidden headers
    # (scripts/request-headers.ts), what `bun install` prunes from node_modules (scripts/install-prune.ts) and when it
    # reuses a cached packument (scripts/packument-cache.ts), and how runbun.json is read (scripts/project-config.ts).
    script: 'bun scripts/inspect-corpus/diff.ts && bun scripts/data-apis/jsonl.ts && bun scripts/data-apis/xml-stringify.ts && bun scripts/requests.ts && bun scripts/request-fields.ts && bun scripts/vfs-mirror.ts && bun scripts/test-results.ts && bun scripts/persist-skip.ts && bun scripts/runner-stop.ts && bun scripts/change-origin.ts && bun scripts/request-headers.ts && bun scripts/install-prune.ts && bun scripts/packument-cache.ts && bun scripts/project-config.ts'
    toolchains: ['bun']
    inputs:
      - 'scripts/inspect-corpus/**/*'
      - 'scripts/data-apis/**/*'
      - 'src/worker/jsonl.ts'
      - 'src/worker/xml.ts'
      - 'src/worker/inspect.ts'
      - 'src/worker/promises.ts'
      - 'src/worker/node/inspect.ts'
      - 'src/worker/node/types.ts'
      - 'src/worker/node/util.ts'
      - 'scripts/requests.ts'
      - 'src/embed/requests.ts'
      - 'scripts/request-fields.ts'
      - 'src/request.ts'
      - 'scripts/test-results.ts'
      - 'src/worker/node/test.ts'
      - 'scripts/persist-skip.ts'
      - 'src/persist.ts'
      - 'scripts/runner-stop.ts'
      - 'src/runner.ts'
      - 'scripts/change-origin.ts'
      - 'src/embed/changes.ts'
      - 'src/install.ts'
      - 'src/lockfileWrite.ts'
      - '/packages/vfs/vfs.ts'
      - 'scripts/request-headers.ts'
      - 'scripts/install-prune.ts'
      - 'src/lockfile.ts'
      - 'scripts/packument-cache.ts'
      - 'src/pkgCache.ts'
      - 'src/storage.ts'
      - 'src/worker/requestHeaders.ts'
  test-git:
    # The WASI host over the VFS (src/git/wasi.ts): its edge cases, then crates/git-wasm's git.wasm committing into a
    # VFS whose .git native git then checks (fsck, log, status); the git worker's copy of the project (mirror.ts) staying
    # equal to the page's through git commands; then the Git panel's parsers (parse.ts) on native git's output.
    script: 'node src/git/wasi.test.ts && node src/git/mirror.test.ts && node src/git/parse.test.ts'
    toolchains: ['node']
    deps:
      - 'git-wasm:build'
    inputs:
      - 'src/git/**/*'
      - '/crates/git-wasm/target/wasm32-wasip1/release/git.wasm'
  test-lockfile:
    # The bun.lock an install writes without one (src/lockfileWrite.ts) against native `bun install --lockfile-only` on
    # scripts/lockfile-write/*, then `bun install --frozen-lockfile` on it, then an update after package.json changes.
    # Fetches from registry.npmjs.org, so it isn't part of `test`; npm's latest versions move, so it isn't cached.
    script: 'bun scripts/lockfile-write.ts'
    toolchains: ['bun']
    options:
      cache: false
  test-shell:
    # Bun's own shell tests (bun/test/js/bun/shell: bunshell.test.ts and commands/*.test.ts) against src/shell under
    # node, on real temp dirs (src/shell/conformance/run.ts); tests that spawn a native Bun or tool are skipped.
    script: 'node src/shell/conformance/run.ts'
    toolchains: ['node']
    deps:
      - 'shell-wasm:build'
    inputs:
      - 'src/shell/**/*'
      - '/bun/test/js/bun/shell/**/*'
      - '/target/wasm64-unknown-unknown/release/bun_shell_wasm.wasm'
  check-examples:
    # Every project of the examples submodule opened in the playground in headless Chrome: it installs and runs
    # (scripts/check-examples.ts). Before moving the submodule to a new commit, and after a Bun upgrade.
    command: 'bun scripts/check-examples.ts'
    toolchains: ['bun']
    options:
      cache: false
  test-processes:
    # Child processes end to end (scripts/processes.ts): a project that spawns, pipes, kills and nests children runs
    # in the embed in headless Chrome, on the editor's origin and on a content origin, and prints what native Bun
    # prints for it; the synchronous calls run on an isolated embedder (on both origins) and throw on one that isn't.
    # Needs Chrome, so it isn't part of `test`.
    script: 'bun scripts/processes.ts && bun scripts/processes.ts --no-native --isolated && bun scripts/processes.ts --no-native --content-origin --isolated'
    toolchains: ['bun']
    options:
      cache: false
  test-bun-test:
    # `bun:test` end to end (scripts/bun-test.ts): the files of fixtures/bun-test run through the console's `bun test`
    # in headless Chrome, and its summary, failures and snapshot files are compared with native `bun test`'s for the
    # same files. Needs Chrome, so it isn't part of `test`.
    command: 'bun scripts/bun-test.ts'
    toolchains: ['bun']
    options:
      cache: false
  test-errors:
    # Errors as programs see and print them (scripts/errors.ts): `error.stack`'s names, paths and columns, uncaught
    # errors' source previews, I/O errors and promise states in the embed in headless Chrome, against native Bun's
    # output for the same files. Needs Chrome, so it isn't part of `test`.
    command: 'bun scripts/errors.ts'
    toolchains: ['bun']
    options:
      cache: false
  test-cookies:
    # The preview's cookies end to end (scripts/cookies.ts): a script's cookie with a narrower path, its changes to a
    # server's cookie, and a reload's sweep of the old preview base's, on the editor's origin and on a content origin
    # (same site, and embedded on another site, where only the server's cookies can work). Needs Chrome.
    script: 'bun scripts/cookies.ts && bun scripts/cookies.ts --content-origin && bun scripts/cookies.ts --content-origin --third-party'
    toolchains: ['bun']
    options:
      cache: false
  fmt-examples:
    # The gallery's projects (examples/, the demo included) as `bun fmt` leaves them (`-- --write` formats them).
    command: 'bun scripts/fmt-examples.ts'
    toolchains: ['bun']
    inputs:
      - 'examples/**/*'
      - '!examples/**/node_modules/**/*'
      - 'scripts/fmt-examples.ts'
  build:
    # prebuild (scripts/copy-wasm.ts) copies the crates' .wasm into public/.
    command: 'bun run build'
    # The runbun.dev build: project code runs on run.runbun.dev (src/contentOrigin.ts), and host.html there answers the
    # editor (and the local runner's page, packages/connect). Bake them here so the cached dist/ always has them.
    env:
      VITE_CONTENT_ORIGIN: 'https://run.runbun.dev'
      VITE_EDITOR_ORIGINS: 'https://runbun.dev,http://127.0.0.1:7357'
    deps:
      - 'semver-wasm:build'
      - 'transpile-wasm:build'
      - 'bundle-wasm:build'
      - 'resolve-wasm:build'
      - 'fmt-wasm:build'
      - 'check-wasm:build'
      - 'tsrs-ls-wasm:build'
      - 'git-wasm:build'
      - 'shell-wasm:build'
    inputs:
      - '@group(sources)'
    outputs:
      - 'dist/**/*'
  dev:
    # strictPort: the docs frame the playground at localhost:5173 (apps/docs/site-urls.ts).
    command: 'bun run dev --strictPort'
    preset: 'server'
    deps:
      - 'semver-wasm:build'
      - 'transpile-wasm:build'
      - 'bundle-wasm:build'
      - 'resolve-wasm:build'
      - 'fmt-wasm:build'
      - 'check-wasm:build'
      - 'tsrs-ls-wasm:build'
      - 'git-wasm:build'
      - 'shell-wasm:build'
  secrets:
    # Sign in with GitHub (worker/auth.ts): pushes apps/playground/.dev.vars (GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET,
    # BETTER_AUTH_SECRET; gitignored) to the runbun.dev and canary Workers as secrets. Again when a value changes.
    script: 'bunx wrangler secret bulk .dev.vars && bunx wrangler secret bulk .dev.vars --env canary'
    options:
      cache: false
      runInCI: false
  deploy-canary:
    # canary.runbun.dev (wrangler.jsonc env.canary): a production build into dist-canary/ that links docs-canary, so
    # moon's cached dist/ stays the runbun.dev build. noindex keeps it out of search results.
    script: >-
      bun scripts/copy-wasm.ts --strip && bunx tsrs --noEmit && bunx tsrs -p tsconfig.sw.json && bunx vite build --outDir dist-canary &&
      ../../scripts/canary-dist.ts dist-canary && bunx wrangler deploy --env canary
    env:
      DOCS_URL: 'https://docs-canary.runbun.dev/'
      PLAYGROUND_URL: 'https://canary.runbun.dev/'
      # Its own content origin (wrangler.jsonc env.canary), so the canary never depends on the runbun.dev one.
      VITE_CONTENT_ORIGIN: 'https://run-canary.runbun.dev'
      VITE_EDITOR_ORIGINS: 'https://canary.runbun.dev,http://127.0.0.1:7357'
      # Shows the canary badge/banner (apps/playground/src/canary.ts, apps/docs/src/components/Banner.astro).
      CANARY: '1'
    deps:
      - 'semver-wasm:build'
      - 'transpile-wasm:build'
      - 'bundle-wasm:build'
      - 'resolve-wasm:build'
      - 'fmt-wasm:build'
      - 'check-wasm:build'
      - 'tsrs-ls-wasm:build'
      - 'git-wasm:build'
      - 'shell-wasm:build'
    options:
      cache: false
      runInCI: false
