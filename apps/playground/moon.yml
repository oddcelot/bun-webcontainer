$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'

fileGroups:
  sources:
    - 'src/**/*'
    - 'worker/**/*'
    - 'embed-element/**/*'
    - 'public/**/*'
    # Copied in from the wasm crates by scripts/copy-wasm.ts; their builds are deps instead.
    - '!public/*.wasm'
    - 'scripts/**/*'
    - '/patches/npm/**/*'
    - '*.html'
    - '*.ts'
    - 'tsconfig*.json'
    - 'package.json'
    - '/packages/ui/**/*'
    - '/packages/vfs/**/*'
    - '/bun.lock'

tasks:
  typecheck:
    command: 'bun run typecheck'
    inputs:
      - '@group(sources)'
  build:
    # prebuild (scripts/copy-wasm.ts) copies the crates' .wasm into public/.
    command: 'bun run build'
    deps:
      - 'semver-wasm:build'
      - 'transpile-wasm:build'
      - 'bundle-wasm:build'
      - 'resolve-wasm:build'
      - 'fmt-wasm:build'
      - 'tsrs-ls-wasm:build'
    inputs:
      - '@group(sources)'
    outputs:
      - 'dist/**/*'
  dev:
    # strictPort: the docs frame the playground at localhost:5173 (apps/docs/site-urls.ts).
    command: 'bun run dev --strictPort'
    preset: 'server'
    deps:
      - 'semver-wasm:build'
      - 'transpile-wasm:build'
      - 'bundle-wasm:build'
      - 'resolve-wasm:build'
      - 'fmt-wasm:build'
      - 'tsrs-ls-wasm:build'
  deploy-canary:
    # canary.runbun.dev (wrangler.jsonc env.canary): a production build into dist-canary/ that links docs-canary, so
    # moon's cached dist/ stays the runbun.dev build. noindex keeps it out of search results.
    script: >-
      bun scripts/copy-wasm.ts --strip && bunx tsrs --noEmit && bunx tsrs -p tsconfig.sw.json && bunx vite build --outDir dist-canary &&
      ../../scripts/canary-dist.ts dist-canary && bunx wrangler deploy --env canary
    env:
      DOCS_URL: 'https://docs-canary.runbun.dev/'
      PLAYGROUND_URL: 'https://canary.runbun.dev/'
      # Shows the canary badge/banner (apps/playground/src/canary.ts, apps/docs/src/components/Banner.astro).
      CANARY: '1'
    deps:
      - 'semver-wasm:build'
      - 'transpile-wasm:build'
      - 'bundle-wasm:build'
      - 'resolve-wasm:build'
      - 'fmt-wasm:build'
      - 'tsrs-ls-wasm:build'
    options:
      cache: false
      runInCI: false
