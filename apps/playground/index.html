<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>runbun.dev · Bun in your browser</title>
    <meta name="description" content="Run Bun.serve apps, install packages and edit TypeScript in a tab, built from Bun&#39;s own Rust crates compiled to wasm64." />
    <link rel="canonical" href="https://runbun.dev/" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- theme.ts keeps this on the active theme's panel color. -->
    <meta name="theme-color" content="#171717" />
    <!-- The last theme's colors (theme.ts saves them), applied before the first paint so a reload, e.g. switching projects, doesn't flash style.css's dark defaults. -->
    <script>
      try {
        for (const [k, v] of Object.entries(JSON.parse(localStorage.getItem("theme-vars") || "{}"))) if (v) document.documentElement.style.setProperty(k, v);
      } catch {}
    </script>
    <!--
      A different name on every visit, shown in the header and the tab title from the first paint. Switching projects
      reloads the page too, so the name lives in the tab's session storage and is picked again (never the same one)
      only on a real reload or in a new tab. src/ui/Title.tsx shows the stored name.
    -->
    <script>
      try {
        const titles = ["Bun Away", "Always Bunning", "Bun and Done", "Hot Cross Bun", "Bun in the Oven", "Bun Shot", "Bundle of Joy", "Bun Voyage", "On the Bun"];
        const reload = performance.getEntriesByType("navigation")[0]?.type === "reload";
        let title = sessionStorage.getItem("title");
        if (!title || reload || !titles.includes(title)) {
          const pool = titles.filter((t) => t !== title);
          title = pool[Math.floor(Math.random() * pool.length)];
          sessionStorage.setItem("title", title);
        }
        // The tab keeps the site name, so bookmarks and search results stay recognizable.
        document.title = `${title} · runbun.dev`;
      } catch {}
      // Hides the static header until the app renders its own (see style.css); without JavaScript it stays visible.
      document.documentElement.dataset.booting = "";
    </script>

    <!-- Social cards need absolute URLs: these point at the runbun.dev deploy. The images come from `bun run og`. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="runbun.dev" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://runbun.dev/" />
    <meta property="og:title" content="Bun in your browser · runbun.dev" />
    <meta property="og:description" content="Run Bun.serve apps, install packages and edit TypeScript in a tab, built from Bun&#39;s own Rust crates compiled to wasm64." />
    <meta property="og:image" content="https://runbun.dev/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bun&#39;s logo next to the words: Bun in your browser" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@oddcelot" />
    <meta name="twitter:title" content="Bun in your browser · runbun.dev" />
    <meta name="twitter:description" content="Run Bun.serve apps, install packages and edit TypeScript in a tab, built from Bun&#39;s own Rust crates compiled to wasm64." />
    <meta name="twitter:image" content="https://runbun.dev/og.png" />
    <meta name="twitter:image:alt" content="Bun&#39;s logo next to the words: Bun in your browser" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "runbun.dev",
        "alternateName": "Bun playground",
        "url": "https://runbun.dev/",
        "description": "Run Bun.serve apps, install packages and edit TypeScript in a tab, built from Bun's own Rust crates compiled to wasm64.",
        "image": "https://runbun.dev/og.png",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any (needs a browser with WebAssembly Memory64, e.g. Chrome)",
        "browserRequirements": "Requires WebAssembly Memory64",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- src/ui/App.tsx renders the page; this header is what crawlers and no-JS visitors see. -->
    <header>
      <h1 class="title"><span class="logo" aria-hidden="true"></span><span class="sr-only">runbun.dev: Bun in your browser</span><span id="title" aria-hidden="true">Bun playground</span></h1>
      <script>
        try {
          document.getElementById("title").textContent = sessionStorage.getItem("title") || "Bun playground";
        } catch {}
      </script>
      <a id="docs" href="https://docs.runbun.dev/">Docs</a>
    </header>
    <!-- The theme's overlay (style.css); outside the header, which the app replaces. -->
    <div class="overlay" aria-hidden="true"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
