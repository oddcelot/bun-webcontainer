# Draft generator for packages/astro/CHANGELOG.md, @runbun/astro's own changelog on its own versions (`astro-v*` tags).
# Same trailers as the root cliff.toml, which explains them; only `Changelog: <kind> astro` lands here.
# `moon run astro:changelog` prints a draft (`-- --tag astro-v0.2.0` to head it with the version).

[changelog]
header = ""
body = """
## {{ version | default(value="Unreleased") | trim_start_matches(pat="astro-v") }} — {% if timestamp %}{{ timestamp | date(format="%Y-%m-%d") }}{% else %}{{ now() | date(format="%Y-%m-%d") }}{% endif %}
{% for kind in ["Added", "Changed", "Fixed", "Removed"] %}
{%- for commit in commits %}
{%- if commit.message is containing("Changelog-Entry: " ~ kind) or commit.message is containing("Changelog: " ~ kind) %}
{%- set lines = commit.message | split(pat="\n") %}
{%- set head = lines | first %}
{%- if head is starting_with("Changelog-Entry") %}
- **{{ kind }}** — {{ lines | slice(start=1) | join(sep=" ") | trim }}
{%- else %}
- **{{ kind }}** — **{{ head }}** <!-- no entry under the trailer; drafted from the body -->
{%- for line in lines | slice(start=1) %}
{%- if not line is starting_with("Changelog:") and not line is starting_with("Co-Authored-By:") %}
{{ "  " ~ line | trim_end }}
{%- endif %}
{%- endfor %}
{%- endif %}
{%- endif %}
{%- endfor %}
{%- endfor %}
"""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
filter_commits = true
tag_pattern = "^astro-v[0-9]"
commit_preprocessors = [
  { pattern = '(?s)^.*?\nChangelog: ?(\w+( [\w-]+)?)\n((?:[ \t]+[^\n]*\n?)+).*$', replace = "Changelog-Entry: ${1}\n${3}" },
  { pattern = '(?m)^[ \t]+', replace = "" },
]
commit_parsers = [
  { message = "(?ms)^Changelog(-Entry)?: ?\\w+ astro$", group = "astro" },
  { message = ".*", skip = true },
]
