$schema: 'https://moonrepo.dev/schemas/project.json'

# Vendored @astrojs/solid-js v8 (README.md): src/ is upstream's, built with tsrs into dist/.
language: 'typescript'

fileGroups:
  sources:
    - 'src/**/*'
    - 'tsconfig.json'
    - 'package.json'

tasks:
  build:
    command: 'bun run build'
    deps: ['astro-solid-renderer:build']
    inputs:
      - '@group(sources)'
    outputs:
      - 'dist/**/*'
