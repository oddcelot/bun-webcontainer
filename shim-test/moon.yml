$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'rust'

tasks:
  test:
    # No rust-toolchain.toml here: use the nightly pinned for bun/.
    script: '. ../scripts/bun-pins.sh && cargo +"$TOOLCHAIN" test'
    deps: ['root:setup-bun']
    inputs:
      - 'src/**/*'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '/bun/src/opaque/**/*'
      - '/scripts/bun-pins.sh'
