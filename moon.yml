$schema: 'https://moonrepo.dev/schemas/project.json'

# Root-level project: workspace-wide tasks.
tasks:
  setup-bun:
    # Recreates bun/ (pinned commit + patches/bun/) only when it is missing; never touches an existing checkout.
    script: 'test -d bun || scripts/setup-bun.sh'
    options:
      cache: false
      runInCI: true
      runFromWorkspaceRoot: true
  lint-sh:
    # Warnings and errors only; style notes (SC2012 & co.) don't fail it. Needs shellcheck (Brewfile).
    script: 'shellcheck -S warning scripts/*.sh .claude/hooks/*.sh'
    inputs:
      - '/scripts/*.sh'
      - '/.claude/hooks/*.sh'
    options:
      runFromWorkspaceRoot: true
  typos:
    # Spell check of tracked sources and docs; exceptions in _typos.toml. Needs typos-cli (Brewfile).
    command: 'typos'
    options:
      cache: false
      runFromWorkspaceRoot: true
