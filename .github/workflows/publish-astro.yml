# Publishes packages/astro (@runbun/astro) to npm. Pushing an `astro-v<version>` tag is the release: it checks the tag
# against packages/astro/package.json and the section for it in packages/astro/CHANGELOG.md, builds the package and the
# docs site with it, publishes through npm's trusted publishing (no token; set up once with `npm trust github --file
# publish-astro.yml --repo oddcelot/bun-webcontainer --allow-publish`) and creates the GitHub Release from the
# changelog section. A version already on npm is skipped, so a failed run can be rerun. A tag with a `-`
# (astro-v0.3.0-beta.1) publishes under `next` and makes a prerelease. No provenance: npm only generates it for public
# repos.
#
# Running it by hand (Actions → Publish @runbun/astro → Run workflow) is a dry run: it packs and prints what would go out.
name: Publish @runbun/astro

on:
  push:
    tags: ["astro-v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: write # the GitHub Release
  id-token: write # npm trusted publishing (OIDC)

concurrency: publish-astro

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE: ${{ github.event_name == 'push' }}
    defaults:
      run:
        working-directory: packages/astro
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5 or later.
      - run: npm install -g npm@latest

      - name: Version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$RELEASE" = "true" ] && [ "$GITHUB_REF_NAME" != "astro-v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match packages/astro/package.json version $version"
            exit 1
          fi
          ../../scripts/release-notes.ts "astro-v$version" > "$RUNNER_TEMP/notes.md"
          if npm view "@runbun/astro@$version" version >/dev/null 2>&1; then
            echo "::notice::@runbun/astro@$version is on npm already; not publishing it again."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the package
        run: |
          bun install --frozen-lockfile
          bun run build
          # The docs use the vendored @astrojs/solid-js (packages/astro-solid), served from its untracked dist/.
          (cd ../astro-solid && bun run build)

      - name: Check the docs site builds with this package
        working-directory: apps/docs
        run: |
          bun run check
          bun run build

      - name: Pack
        run: npm pack --dry-run

      - name: Publish
        if: ${{ env.RELEASE == 'true' && !steps.version.outputs.published }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) npm publish --access public --tag next ;;
            *) npm publish --access public ;;
          esac

      - name: Create the release
        if: ${{ env.RELEASE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::the $GITHUB_REF_NAME release exists already."
            exit 0
          fi
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "@runbun/astro ${GITHUB_REF_NAME#astro-v}" --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"
