# A runbun release: pushing a `v<version>` tag (`git push origin main --follow-tags`) checks the tag against the root
# package.json's version and CHANGELOG.md's section for it, then creates the GitHub Release from that section. A tag
# with a `-` (v0.3.0-beta.1) makes a prerelease. Deploying runbun.dev and docs.runbun.dev stays a separate, manual
# step (`bun run deploy` in apps/playground and apps/docs). @runbun/astro releases on its own `astro-v*` tags
# (publish-astro.yml).
name: Release

on:
  push:
    # `v` and a digit: `astro-v*` tags are @runbun/astro's.
    tags: ["v[0-9]*"]

permissions:
  contents: write # the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Check the tag matches package.json
        run: |
          version=$(bun -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Notes from CHANGELOG.md
        run: scripts/release-notes.ts "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "runbun ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"
