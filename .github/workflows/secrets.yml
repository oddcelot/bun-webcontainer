# Secret scan: Betterleaks (https://github.com/betterleaks/betterleaks) over the whole git history on every push and
# pull request; a finding fails the job (secrets redacted in the log). The full history takes under a second, so there's
# no per-push commit range to get wrong. Locally: `betterleaks git .` (Brewfile).
name: Secrets

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

env:
  # Bump both together: the version and its linux_x64 tarball's sha256 (from the release's checksums.txt).
  BETTERLEAKS_VERSION: 1.9.0
  BETTERLEAKS_SHA256: f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history, not just the tip

      - name: Install Betterleaks
        run: |
          tarball="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/$tarball"
          echo "$BETTERLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" betterleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan the git history
        run: betterleaks git --no-banner --redact --verbose .
